name: APK oluştur

on:
  workflow_dispatch:
  push:
    paths:
      - '**.zip'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Projeyi aç
        run: |
          ZIP=$(git log -1 --diff-filter=AM --name-only --pretty=format: -- '*.zip' | grep -v '^$' | head -n 1)
          echo "En son yüklenen zip: $ZIP"
          python3 -c "import zipfile,sys; zipfile.ZipFile(sys.argv[1]).extractall('src')" "$ZIP"

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK hazırla
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-35" "build-tools;34.0.0" > /dev/null || true

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: APK derle
        working-directory: src
        run: gradle assembleRelease --no-daemon --stacktrace -PvCode=${{ github.run_number }}

      - name: APK'yı adlandır
        run: cp src/app/build/outputs/apk/release/app-release.apk EzanVakti.apk

      - name: Releases'a yükle
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Ezan Vakti v${{ github.run_number }}
          files: EzanVakti.apk
