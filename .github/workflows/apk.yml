name: APK oluştur

on:
  workflow_dispatch:
  push:
    paths:
      - 'ezan-project.zip'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Projeyi aç
        run: unzip -o ezan-project.zip -d src

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: APK derle
        working-directory: src
        run: gradle assembleRelease --no-daemon --stacktrace -PvCode=${{ github.run_number }}

      - name: APK'yı adlandır
        run: cp src/app/build/outputs/apk/release/app-release.apk EzanVakti.apk

      - name: Releases'a yükle
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Ezan Vakti v${{ github.run_number }}
          files: EzanVakti.apk
